name: Bootstrap ToneMatchTMP source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq ToneMatchTMP-v0.0.03-GitHub-Source.zip
          rm -f ToneMatchTMP-v0.0.03-GitHub-Source.zip
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Tone Match TMP 0.0.03 development preview"
          git push origin HEAD:main
